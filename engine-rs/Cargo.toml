[package]
name = "docx-smart-engine"
version = "0.0.1"
edition = "2021"
description = "Rust rewrite of the docx-smart-format engine (analyze + build / FormatPlan). Raw-OOXML-first."
license = "Apache-2.0"

[[bin]]
name = "docx-auto-template-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
