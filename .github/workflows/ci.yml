name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    name: Build & smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe_suffix: ""
          - os: windows-latest
            exe_suffix: ".exe"
          - os: macos-latest
            exe_suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine-rs/Cargo.lock') }}

      - name: Build release engine
        working-directory: engine-rs
        run: cargo build --release --locked

      - name: Smoke test — build sample docx on every platform
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="engine-rs/target/release/docx-auto-template-engine${{ matrix.exe_suffix }}"
          test -x "$ENGINE"
          mkdir -p ci-out
          for plan in examples/01-basic.json examples/02-autoformat.json \
                      examples/04-vertical-pagenum.json examples/05-omml-equation.json \
                      examples/07-thesis-preset.json examples/09-firstline-scale-test.json; do
            name=$(basename "$plan" .json)
            "$ENGINE" build --plan "$plan" --output "ci-out/${name}.docx"
            test -s "ci-out/${name}.docx"
            echo "OK $name"
          done

      - name: Smoke test — references (with normalize-references)
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="engine-rs/target/release/docx-auto-template-engine${{ matrix.exe_suffix }}"
          "$ENGINE" build \
            --plan examples/03-references.json \
            --output ci-out/03-references.docx \
            --normalize-references
          test -s ci-out/03-references.docx
          echo "OK 03-references"

      - name: Smoke test — template-apply (with --template)
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="engine-rs/target/release/docx-auto-template-engine${{ matrix.exe_suffix }}"
          "$ENGINE" build \
            --plan examples/08-template-apply.json \
            --template examples/template.docx \
            --output ci-out/08-template-apply.docx
          test -s ci-out/08-template-apply.docx
          echo "OK 08-template-apply"

      - name: Smoke test — analyze round-trip
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="engine-rs/target/release/docx-auto-template-engine${{ matrix.exe_suffix }}"
          "$ENGINE" analyze --input ci-out/01-basic.docx --output ci-out/01-basic-analysis.json
          test -s ci-out/01-basic-analysis.json
          grep -q '"body"' ci-out/01-basic-analysis.json
          echo "OK analyze round-trip"

      - name: Verify binary size (alpha < 5 MB guardrail)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ENGINE="engine-rs/target/release/docx-auto-template-engine${{ matrix.exe_suffix }}"
          ls -lh "$ENGINE"
          size_bytes=$(stat -c%s "$ENGINE" 2>/dev/null || stat -f%z "$ENGINE")
          echo "binary size: $size_bytes bytes"
          if [ "$size_bytes" -gt 5242880 ]; then
            echo "ERROR: binary exceeded 5 MB guardrail"
            exit 1
          fi

  fmt-and-clippy:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        working-directory: engine-rs
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: engine-rs
        run: cargo clippy --release --locked -- -D warnings
