name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & attach Skill bundle (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe_suffix: ".exe"
          - os: ubuntu-latest
            rid: linux-x64
            exe_suffix: ""
          - os: macos-latest
            rid: osx-arm64
            exe_suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release engine (${{ matrix.rid }})
        working-directory: engine-rs
        run: cargo build --release --locked

      - name: Stage Skill bundle (Skill files + compiled engine, NO Rust source)
        shell: bash
        run: |
          set -euo pipefail
          # The folder name here is what users drop into ~/.claude/skills/
          STAGING="staging/docx-smart-format"
          mkdir -p "$STAGING"

          # Skill content (the product)
          cp SKILL.md "$STAGING/"
          cp README.md "$STAGING/"
          cp LICENSE NOTICE CHANGELOG.md "$STAGING/" 2>/dev/null || true
          cp -r references "$STAGING/"
          cp -r agents "$STAGING/"
          cp -r scripts "$STAGING/"
          cp -r examples "$STAGING/"

          # Compiled engine binary (the dependency). Source code stays
          # behind in engine-rs/ and is NEVER included in the release zip.
          mkdir -p "$STAGING/engine"
          cp engine-rs/target/release/docx-auto-template-engine${{ matrix.exe_suffix }} \
             "$STAGING/engine/"

          echo "=== Staged Skill bundle contents ==="
          find "$STAGING" -maxdepth 2 -type f | sort
          echo ""
          echo "=== Verifying NO Rust source in bundle ==="
          if find "$STAGING" -name '*.rs' -o -name 'Cargo.toml' -o -name 'Cargo.lock' 2>/dev/null | grep -q .; then
            echo "ERROR: Rust source leaked into Skill bundle"
            find "$STAGING" -name '*.rs' -o -name 'Cargo.toml' -o -name 'Cargo.lock'
            exit 1
          fi
          echo "OK -- no .rs / Cargo files in bundle"

      - name: Zip Skill bundle
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          NAME="docx-smart-format-${TAG}-${{ matrix.rid }}.zip"
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path staging/docx-smart-format -DestinationPath '$NAME'"
          else
            (cd staging && zip -r "../$NAME" docx-smart-format)
          fi
          ls -la "$NAME"
          echo "ASSET_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
