name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & attach (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe_suffix: ".exe"
          - os: ubuntu-latest
            rid: linux-x64
            exe_suffix: ""
          - os: macos-latest
            rid: osx-arm64
            exe_suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release engine (${{ matrix.rid }})
        working-directory: engine-rs
        run: cargo build --release --locked

      - name: Stage payload
        shell: bash
        run: |
          set -euo pipefail
          STAGING="staging/docx-smart-engine"
          mkdir -p "$STAGING"
          cp engine-rs/target/release/docx-auto-template-engine${{ matrix.exe_suffix }} "$STAGING/"
          cp -r dist/samples "$STAGING/"
          cp dist/README.txt "$STAGING/"
          cp LICENSE NOTICE CHANGELOG.md "$STAGING/" || true
          ls -la "$STAGING/"

      - name: Zip payload
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          NAME="docx-smart-engine-${TAG}-${{ matrix.rid }}.zip"
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path staging/docx-smart-engine/* -DestinationPath '$NAME'"
          else
            (cd staging/docx-smart-engine && zip -r "../../$NAME" .)
          fi
          ls -la "$NAME"
          echo "ASSET_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
